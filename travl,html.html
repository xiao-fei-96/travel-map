<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>旅行地图 · 记录走过的路</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1419;
    --panel:#161b22;
    --panel2:#1c2430;
    --line:#2a3441;
    --text:#e6edf3;
    --muted:#8b98a5;
    --accent:#4a9eff;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
  }
  #app{display:flex;height:100vh;height:100dvh;}

  /* ============ 侧边栏 ============ */
  #sidebar{
    width:380px;flex:0 0 380px;background:var(--panel);
    display:flex;flex-direction:column;border-right:1px solid var(--line);
    z-index:1000;box-shadow:4px 0 24px rgba(0,0,0,.35);
  }
  #sidebar header{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  #sidebar h1{font-size:17px;margin:0 0 12px;font-weight:600;letter-spacing:.5px;}
  #btnNew{
    width:100%;padding:11px;border-radius:10px;border:none;
    background:linear-gradient(135deg,#4a9eff,#7b61ff);
    color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    transition:.2s;letter-spacing:.5px;
  }
  #btnNew:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 6px 18px rgba(74,158,255,.3);}
  #btnNew:active{transform:translateY(0);}

  #journeyList{flex:1;overflow-y:auto;padding:12px;}
  #journeyList::-webkit-scrollbar{width:6px;}
  #journeyList::-webkit-scrollbar-thumb{background:#2f3a49;border-radius:3px;}

  #emptyHint{padding:40px 24px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9;}
  #emptyHint .big{font-size:34px;display:block;margin-bottom:8px;opacity:.8;}

  .journey-card{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:10px;cursor:pointer;transition:.18s;position:relative;
  }
  .journey-card:hover{border-color:#3d4a5c;transform:translateX(2px);background:#202a37;}
  .journey-card.hidden-journey{opacity:.45;}
  .journey-card.hidden-journey:hover{opacity:.75;}

  .jc-head{display:flex;align-items:center;gap:5px;margin-bottom:8px;}
  .jc-eye{
    background:transparent;border:none;color:#6c7a8a;cursor:pointer;
    padding:3px;border-radius:6px;display:flex;align-items:center;
    transition:.15s;flex:0 0 auto;
  }
  .jc-eye:hover{color:#fff;background:rgba(255,255,255,.09);}
  .jc-eye.off{color:#414c5a;}
  .jc-dot{
    width:11px;height:11px;border-radius:50%;flex:0 0 11px;
    box-shadow:0 0 8px currentColor;cursor:pointer;transition:.15s;
    border:1px solid rgba(255,255,255,.25);
  }
  .jc-dot:hover{transform:scale(1.25);}
  .jc-name{font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .jc-icon{
    background:transparent;border:none;cursor:pointer;font-size:13px;
    padding:2px 4px;border-radius:6px;line-height:1;transition:.15s;opacity:.65;
  }
  .jc-icon:hover{opacity:1;background:rgba(255,255,255,.09);}
  .jc-del{
    background:transparent;border:none;color:#5a6674;cursor:pointer;font-size:14px;
    padding:2px 5px;border-radius:6px;line-height:1;transition:.15s;
  }
  .jc-del:hover{color:#ff7b72;background:rgba(255,123,114,.12);}

  .jc-route{display:flex;flex-wrap:wrap;align-items:center;gap:3px;font-size:12.5px;line-height:1.9;color:#c3ccd6;}
  .jc-route .stop-name{white-space:nowrap;}
  .jc-route .mode-chip{font-size:13px;opacity:.95;margin:0 1px;}
  .jc-date{font-size:11.5px;color:var(--muted);margin-top:7px;letter-spacing:.3px;}

  .jc-photos{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap;}
  .jc-photo{
    width:48px;height:48px;object-fit:cover;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);transition:.15s;background:#0d1117;
  }
  .jc-photo:hover{border-color:var(--accent);transform:scale(1.06);}
  .jc-photo-more{
    width:48px;height:48px;border-radius:7px;background:#22303f;color:#8fb8e8;
    display:flex;align-items:center;justify-content:center;font-size:12px;
    cursor:pointer;border:1px solid var(--line);transition:.15s;
  }
  .jc-photo-more:hover{border-color:var(--accent);color:#c8e0ff;}

  #sidebar footer{
    padding:10px 12px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
  }
  #sidebar footer button{
    padding:9px 4px;border-radius:9px;border:1px solid var(--line);
    background:transparent;color:#b9c4cf;font-size:12px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  #sidebar footer button:hover{background:#222c39;color:#fff;border-color:#3d4a5c;}
  #sidebar footer button.active{
    background:rgba(74,158,255,.16);border-color:var(--accent);color:#c8e0ff;
  }

  /* ============ 地图 ============ */
  #map{flex:1;min-width:0;background:#0b0f14;}
  .leaflet-container{background:#0b0f14;font-family:inherit;}

  .stop-marker{background:none!important;border:none!important;}
  .stop-marker .dot{
    position:relative;
    width:13px;height:13px;border-radius:50%;
    background:var(--c);border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 3px rgba(255,255,255,.12);
  }
  .stop-marker .cam-dot{
    position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;
    background:#ffd866;border:1px solid #0f1419;
  }
  .stop-tip{
    background:rgba(22,27,34,.94)!important;color:#e6edf3!important;
    border:1px solid #3d4a5c!important;border-radius:8px!important;
    font-size:11px!important;padding:3px 8px!important;box-shadow:0 3px 10px rgba(0,0,0,.45)!important;
    text-align:center;line-height:1.3;
  }
  .stop-tip::before{display:none!important;}
  .stop-tip .tip-name{font-weight:600;}
  .stop-tip .tip-time{font-size:10px;opacity:.78;margin-top:1px;white-space:nowrap;}

  .mode-marker{background:none!important;border:none!important;}
  .mode-badge{
    width:24px;height:24px;border-radius:50%;background:#161b22;
    border:1.5px solid var(--c);display:flex;align-items:center;justify-content:center;
    font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.5);line-height:1;
  }

  .arrow-marker{background:none!important;border:none!important;}

  /* Leaflet 弹窗 */
  .leaflet-popup-content-wrapper{
    background:#1b2431;color:#e6edf3;border-radius:11px;
    border:1px solid #3d4a5c;box-shadow:0 10px 34px rgba(0,0,0,.7);
  }
  .leaflet-popup-tip{background:#1b2431;border:1px solid #3d4a5c;}
  .leaflet-popup-close-button{color:#8b98a5!important;font-size:20px!important;padding:6px 8px 0 0!important;}
  .leaflet-popup-close-button:hover{color:#fff!important;}
  .leaflet-popup-content{margin:13px 15px;font-size:13px;min-width:150px;}
  .popup-title{font-size:14px;font-weight:600;margin-bottom:2px;}
  .popup-sub{font-size:11px;color:#8b98a5;margin-bottom:7px;}
  .popup-time{
    font-size:11.5px;color:#c3ccd6;background:#0f1419;border:1px solid #2a3441;
    border-radius:7px;padding:5px 8px;margin-bottom:9px;white-space:nowrap;
  }
  .popup-note{
    font-size:12px;color:#c3ccd6;background:#0f1419;border:1px solid #2a3441;
    border-left:3px solid var(--accent);
    border-radius:7px;padding:6px 9px;margin-bottom:9px;line-height:1.55;
    max-height:110px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;
  }
  .popup-photos{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
  .popup-thumb{
    width:52px;height:52px;object-fit:cover;border-radius:7px;cursor:pointer;
    border:1px solid #3d4a5c;transition:.15s;
  }
  .popup-thumb:hover{border-color:var(--accent);transform:scale(1.05);}
  .popup-more{font-size:11px;color:#8b98a5;margin-bottom:8px;}
  .popup-add-photo{
    width:100%;padding:7px;border-radius:8px;border:1px dashed #3a4757;
    background:transparent;color:#8fb8e8;font-size:12px;cursor:pointer;transition:.18s;
  }
  .popup-add-photo:hover{background:#1a2430;border-color:var(--accent);color:#c8e0ff;}

  /* ============ 弹窗 ============ */
  #modal,#cityModal{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(4px);padding:16px;
  }
  #modal{z-index:2000;}
  #cityModal{z-index:2100;}
  #modal.hidden,#cityModal.hidden{display:none;}

  .modal-box,.city-modal-box{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 24px 70px rgba(0,0,0,.7);
  }
  .modal-box{width:min(600px,100%);max-height:90vh;overflow-y:auto;padding:22px 22px 18px;}
  .city-modal-box{width:min(660px,100%);max-height:88vh;display:flex;flex-direction:column;}
  .modal-box::-webkit-scrollbar,.city-detail-list::-webkit-scrollbar{width:7px;}
  .modal-box::-webkit-scrollbar-thumb,.city-detail-list::-webkit-scrollbar-thumb{background:#2f3a49;border-radius:4px;}

  .modal-box h2,.city-modal-box h2{margin:0;font-size:17px;font-weight:600;}
  .field-label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;}

  #tripName{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:14px;outline:none;
  }
  #tripName:focus{border-color:var(--accent);}

  /* 色板 */
  .swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .swatch{
    width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;
    border:2px solid transparent;transition:.16s;position:relative;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .swatch:hover{transform:scale(1.14);}
  .swatch.active{
    border-color:#fff;
    box-shadow:0 0 0 3px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.5);
    transform:scale(1.1);
  }
  .swatch.custom{
    background:conic-gradient(#ff7b72,#ffd866,#7ee787,#6ee7d3,#4a9eff,#d2a8ff,#ff7b72);
    overflow:hidden;border:2px solid #3d4a5c;
  }
  .swatch.custom.active{border-color:#fff;}
  .swatch.custom input{
    position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:none;padding:0;
  }

  /* 站点行 */
  .stop-row{
    background:#131a23;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;margin-bottom:10px;
  }
  .row-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .tag{
    font-size:11px;padding:2px 9px;border-radius:20px;
    background:#22303f;color:#8fb8e8;letter-spacing:.5px;font-weight:600;
  }
  .tag.start{background:#1f3a2a;color:#7ee787;}
  .row-top .spacer{flex:1;}
  .del-btn{
    background:transparent;border:none;color:#5a6674;cursor:pointer;
    font-size:13px;padding:2px 6px;border-radius:6px;transition:.15s;
  }
  .del-btn:hover{color:#ff7b72;background:rgba(255,123,114,.12);}

  .mode-select{
    width:100%;padding:8px 10px;border-radius:9px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:13px;outline:none;
    cursor:pointer;margin-bottom:9px;
  }
  .mode-select:focus{border-color:var(--accent);}

  .place-field{position:relative;width:100%;}
  .place-field input{
    width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:14px;outline:none;transition:.15s;
  }
  .place-field input::placeholder{color:#546070;}
  .place-field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.12);}
  .suggest-list{
    position:absolute;top:calc(100% + 4px);left:0;right:0;
    background:#1b2431;border:1px solid #33404f;border-radius:10px;
    max-height:230px;overflow-y:auto;z-index:60;display:none;
    box-shadow:0 14px 40px rgba(0,0,0,.6);
  }
  .suggest-list.open{display:block;}
  .suggest-item{
    padding:9px 12px;font-size:13px;cursor:pointer;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.04);
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover,.suggest-item.active{background:#26313f;}
  .suggest-item .nm{flex:0 0 auto;color:#e6edf3;}
  .suggest-item .sub{
    flex:1;color:#6c7a8a;font-size:11px;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .suggest-empty{padding:10px 12px;font-size:12.5px;color:#6c7a8a;}

  /* 站点时间（按钮 + 摘要） */
  .time-block{display:flex;align-items:center;gap:9px;margin-top:9px;flex-wrap:wrap;}
  .time-open-btn{
    padding:6px 11px;border-radius:8px;border:1px dashed #3a4757;
    background:transparent;color:#8fb8e8;font-size:12px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .time-open-btn:hover{background:#1a2430;border-color:var(--accent);color:#c8e0ff;}
  .time-summary{font-size:11.5px;color:#c3ccd6;}
  .time-summary.empty{color:#546070;}

  /* 站点描述 */
  .stop-note{
    width:100%;margin-top:9px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:13px;outline:none;resize:vertical;
    font-family:inherit;line-height:1.55;min-height:46px;
  }
  .stop-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.12);}
  .stop-note::placeholder{color:#546070;}

  /* 站点照片 */
  .stop-photo-bar{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap;}
  .stop-photo-btn{
    padding:6px 11px;border-radius:8px;border:1px dashed #3a4757;
    background:transparent;color:#8fb8e8;font-size:12px;cursor:pointer;
    transition:.18s;white-space:nowrap;
  }
  .stop-photo-btn:hover{background:#1a2430;border-color:var(--accent);color:#c8e0ff;}
  .stop-photos{display:flex;gap:6px;flex-wrap:wrap;}
  .sp-item{position:relative;width:44px;height:44px;}
  .sp-item img{width:100%;height:100%;object-fit:cover;border-radius:7px;border:1px solid var(--line);}
  .sp-del{
    position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;
    background:#ff7b72;color:#2a1010;border:none;cursor:pointer;font-size:11px;
    line-height:1;display:flex;align-items:center;justify-content:center;font-weight:700;
  }
  .sp-del:hover{background:#ff9a92;}

  #btnAddStop{
    width:100%;padding:10px;border-radius:10px;margin-top:4px;
    border:1px dashed #3a4757;background:transparent;color:#8fb8e8;
    font-size:13.5px;cursor:pointer;transition:.18s;
  }
  #btnAddStop:hover{background:#1a2430;border-color:var(--accent);color:#c8e0ff;}

  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions button{
    flex:1;padding:11px;border-radius:10px;font-size:14px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:#b9c4cf;transition:.18s;font-weight:500;
  }
  .modal-actions button:hover{background:#222c39;color:#fff;}
  .modal-actions .primary{
    background:linear-gradient(135deg,#4a9eff,#7b61ff);border:none;color:#fff;font-weight:600;
  }
  .modal-actions .primary:hover{filter:brightness(1.12);}

  /* ============ 时间选择器 ============ */
  #timeModal{
    position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2500;
    display:flex;align-items:center;justify-content:center;padding:16px;
    backdrop-filter:blur(3px);
  }
  #timeModal.hidden{display:none;}
  .time-picker-box{
    width:min(390px,100%);background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.7);
  }
  .time-picker-box h3{margin:0 0 16px;font-size:15px;font-weight:600;}
  .tp-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .tp-label{font-size:12.5px;color:var(--muted);flex:0 0 32px;}
  .tp-input{
    padding:8px 10px;border-radius:8px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:13px;outline:none;
    color-scheme:dark;cursor:pointer;min-width:0;
  }
  .tp-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.12);}
  .tp-arrive-date,.tp-depart-date{flex:1.3;}
  .tp-arrive-time,.tp-depart-time{flex:1;}
  .tp-hint{font-size:11.5px;color:#546070;margin:8px 0 18px;line-height:1.5;}
  .tp-actions{display:flex;gap:10px;}
  .tp-actions button{
    flex:1;padding:10px;border-radius:9px;font-size:13.5px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:#b9c4cf;transition:.18s;
  }
  .tp-actions button:hover{background:#222c39;color:#fff;}
  .tp-actions .primary{
    background:linear-gradient(135deg,#4a9eff,#7b61ff);border:none;color:#fff;font-weight:600;
  }
  .tp-actions .primary:hover{filter:brightness(1.12);}

  /* ============ 城市详情弹窗 ============ */
  .city-modal-head{
    padding:20px 22px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .city-modal-head h2{font-size:17px;font-weight:600;margin:0;}
  .city-modal-head .sub{font-size:12px;color:var(--muted);}
  .city-modal-head .spacer{flex:1;}
  .city-close-x{
    background:transparent;border:none;color:#8b98a5;cursor:pointer;font-size:24px;
    line-height:1;padding:0 4px;transition:.15s;border-radius:6px;
  }
  .city-close-x:hover{color:#fff;background:rgba(255,255,255,.08);}

  .city-detail-list{flex:1;overflow-y:auto;padding:14px 18px 4px;}

  .city-block{
    background:#131a23;border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;margin-bottom:11px;
  }
  .city-block-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
  .city-idx{
    width:22px;height:22px;border-radius:50%;background:#22303f;color:#8fb8e8;
    font-size:11px;display:flex;align-items:center;justify-content:center;
    font-weight:600;flex:0 0 22px;border:1px solid #2f3f52;
  }
  .city-idx.start{background:#1f3a2a;color:#7ee787;border-color:#2c5238;}
  .city-name{font-size:14.5px;font-weight:600;}
  .city-badge{
    font-size:10.5px;padding:1px 7px;border-radius:20px;
    background:#22303f;color:#8fb8e8;letter-spacing:.3px;
  }
  .city-time{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;}

  .city-note{
    width:100%;min-height:52px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);
    background:#0d1117;color:var(--text);font-size:13px;outline:none;resize:vertical;
    font-family:inherit;line-height:1.6;margin-bottom:10px;
  }
  .city-note:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,158,255,.12);}
  .city-note::placeholder{color:#546070;}

  .city-photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .city-photo-wrap{position:relative;width:62px;height:62px;}
  .city-photo{
    width:100%;height:100%;object-fit:cover;border-radius:8px;
    border:1px solid var(--line);cursor:pointer;transition:.15s;display:block;
  }
  .city-photo:hover{border-color:var(--accent);transform:scale(1.05);}
  .city-photo-del{
    position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;
    background:#ff7b72;color:#2a1010;border:none;cursor:pointer;font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .city-photo-del:hover{background:#ff9a92;}
  .city-photo-add{
    width:62px;height:62px;border-radius:8px;border:1.5px dashed #3a4757;
    background:transparent;color:#8fb8e8;font-size:20px;cursor:pointer;
    transition:.18s;display:flex;align-items:center;justify-content:center;
    font-weight:300;line-height:1;
  }

            localStorage.getItem('travel-map-v2') ||
            localStorage.getItem('travel-map-v1');
      journeys = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(journeys)) journeys = [];
    } catch (e) { journeys = []; }

    journeys.forEach(function (j) {
      if (typeof j.visible !== 'boolean') j.visible = true;
      if (!Array.isArray(j.photos)) j.photos = [];
      if (!Array.isArray(j.stops)) j.stops = [];
      j.stops.forEach(normalizeStop);
    });
  }

  const esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* ---------- 时间格式化 ---------- */
  function fmtDT(date, time) {
    if (!date) return '';
    const p = date.split('-');
    const md = p.length >= 3 ? (p[1] + '-' + p[2]) : date;
    return md + (time ? ' ' + time : '');
  }

  function stopTimeText(s) {
    const a = fmtDT(s.arriveDate, s.arriveTime);
    const d = fmtDT(s.departDate, s.departTime);
    if (a && d) return a + ' → ' + d;
    if (a) return '到达 ' + a;
    if (d) return '离开 ' + d;
    return '';
  }

  /* =========================================================
     4. 地图绘制
     ========================================================= */
  function makeStopIcon(color, hasPhoto) {
    return L.divIcon({
      className: 'stop-marker',
      html: '<div class="dot" style="--c:' + color + '">' +
            (hasPhoto ? '<span class="cam-dot"></span>' : '') +
            '</div>',
      iconSize: [13, 13],
      iconAnchor: [6.5, 6.5]
    });
  }

  function buildStopPopup(j, s, i) {
    let html = '<div class="popup-body">';
    html += '<div class="popup-title">' + esc(s.name) + '</div>';
    html += '<div class="popup-sub">' + (i === 0 ? '起点' : '第 ' + i + ' 站') + '</div>';

    if (showCityTime) {
      const t = stopTimeText(s);
      if (t) html += '<div class="popup-time">⏱ ' + esc(t) + '</div>';
    }

    if (s.note) {
      html += '<div class="popup-note">' + esc(s.note) + '</div>';
    }

    if (s.photos && s.photos.length) {
      html += '<div class="popup-photos">';
      s.photos.slice(0, 6).forEach(function (p, k) {
        html += '<img class="popup-thumb" data-k="' + k + '" src="' + p.data + '" alt="">';
      });
      html += '</div>';
      if (s.photos.length > 6) {
        html += '<div class="popup-more">共 ' + s.photos.length + ' 张照片</div>';
      }
    }

    html += '<button class="popup-add-photo" type="button">📷 添加照片</button>';
    html += '</div>';
    return html;
  }

  function bindPopupEvents(el, j, s, i, mk) {
    const addBtn = el.querySelector('.popup-add-photo');
    if (addBtn) {
      addBtn.addEventListener('click', function () {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.multiple = true;
        inp.addEventListener('change', async function () {
          const files = Array.from(inp.files || []);
          if (!files.length) return;
          if (!Array.isArray(s.photos)) s.photos = [];
          toast('正在处理照片…');
          const n = await processFiles(files, s.photos, PHOTO_LIMIT_PER_STOP);
          if (n) {
            persist();
            renderSidebar();
            mk.setIcon(makeStopIcon(j.color, s.photos.length > 0));
            mk.setPopupContent(buildStopPopup(j, s, i));
            setTimeout(function () {
              const pop = mk.getPopup();
              const el2 = pop && pop.getElement();
              if (el2) bindPopupEvents(el2, j, s, i, mk);
            }, 40);
            toast('已为「' + s.name + '」添加 ' + n + ' 张照片');
          }
        });
        inp.click();
      });
    }

    el.querySelectorAll('.popup-thumb').forEach(function (img) {
      img.addEventListener('click', function () {
        const k = parseInt(img.dataset.k, 10);
        openViewer(s.photos, k, s.name);
      });
    });
  }

  function renderJourney(j) {
    const group = L.layerGroup();
    const arrowGroup = L.layerGroup();
    const stops = j.stops || [];

    if (stops.length > 1) {
      L.polyline(stops.map(function (s) { return [s.lat, s.lng]; }), {
        color: j.color, weight: LINE_WEIGHT, opacity: 0.8,
        lineCap: 'round', lineJoin: 'round'
      }).addTo(group);
    }

    stops.forEach(function (s, i) {
      const hasPhoto = s.photos && s.photos.length > 0;
      const mk = L.marker([s.lat, s.lng], {
        icon: makeStopIcon(j.color, hasPhoto),
        zIndexOffset: 500
      }).addTo(group);

      const timeText = showCityTime ? stopTimeText(s) : '';
      const tipHtml =
        '<div class="tip-name">' + esc(s.name) + '</div>' +
        (timeText ? '<div class="tip-time">' + esc(timeText) + '</div>' : '');

      mk.bindTooltip(tipHtml, {
        permanent: true, direction: 'top', offset: [0, -8],
        className: 'stop-tip'
      });

      mk.bindPopup(buildStopPopup(j, s, i), { maxWidth: 290, minWidth: 170 });
      mk.on('popupopen', function (ev) {
        const el = ev.popup.getElement();
        if (el) bindPopupEvents(el, j, s, i, mk);
      });
    });

    for (let i = 1; i < stops.length; i++) {
      const a = stops[i - 1], b = stops[i];
      const mode = MODE_MAP[stops[i].mode] || MODE_MAP.other;
      const mid = [(a.lat + b.lat) / 2, (a.lng + b.lng) / 2];
      L.marker(mid, {
        icon: L.divIcon({
          className: 'mode-marker',
          html: '<div class="mode-badge" style="--c:' + j.color + '">' + mode.icon + '</div>',
          iconSize: [24, 24], iconAnchor: [12, 12]
        }),
        interactive: false, zIndexOffset: 800
      }).addTo(group);
    }

    group.addTo(map);
    arrowGroup.addTo(map);
    layerRegistry.set(j.id, { group: group, arrowGroup: arrowGroup });
  }

  function rebuildArrows() {
    const z = map.getZoom();
    layerRegistry.forEach(function (obj, id) {
      const j = journeys.filter(function (x) { return x.id === id; })[0];
      obj.arrowGroup.clearLayers();
      if (!j || !j.visible || !j.stops || j.stops.length < 2) return;

      const stops = j.stops;
      for (let i = 1; i < stops.length; i++) {
        const a = stops[i - 1], b = stops[i];
        const pa = map.project([a.lat, a.lng], z);
        const pb = map.project([b.lat, b.lng], z);
        const total = pa.distanceTo(pb);
        if (total < 45) continue;

        const midPt = L.point((pa.x + pb.x) / 2, (pa.y + pb.y) / 2);
        const deg = Math.atan2(pb.y - pa.y, pb.x - pa.x) * 180 / Math.PI + 90;

        const count = Math.max(1, Math.floor(total / 120));
        for (let k = 1; k <= count; k++) {
          const t = k / (count + 1);
          const px = pa.x + (pb.x - pa.x) * t;
          const py = pa.y + (pb.y - pa.y) * t;
          if (L.point(px, py).distanceTo(midPt) < 22) continue;

          const ll = map.unproject(L.point(px, py), z);
          L.marker(ll, {
            icon: L.divIcon({
              className: 'arrow-marker',
              html:
                '<svg width="14" height="14" viewBox="0 0 16 16" ' +
                'style="transform:rotate(' + deg + 'deg);transform-origin:50% 50%;display:block">' +
                '<path d="M8 2.5 L12.6 12.6 L8 10.3 L3.4 12.6 Z" fill="' + j.color + '" ' +
                'stroke="rgba(0,0,0,.35)" stroke-width="0.7" stroke-linejoin="round"/></svg>',
              iconSize: [14, 14], iconAnchor: [7, 7]
            }),
            interactive: false, zIndexOffset: 300
          }).addTo(obj.arrowGroup);
        }
      }
    });
  }

  function renderAll() {
    layerRegistry.forEach(function (obj) {
      map.removeLayer(obj.group);
      map.removeLayer(obj.arrowGroup);
    });
    layerRegistry.clear();
    journeys.forEach(function (j) { if (j.visible) renderJourney(j); });
    rebuildArrows();
  }

  function fitJourney(j) {
    if (!j.stops || !j.stops.length) return;
    const pts = j.stops.map(function (s) { return [s.lat, s.lng]; });
    if (pts.length === 1) map.setView(pts[0], 9);
    else map.fitBounds(L.latLngBounds(pts).pad(0.28), { maxZoom: 12 });
  }

  function fitAll() {
    const all = [];
    journeys.forEach(function (j) {
      if (!j.visible) return;
      (j.stops || []).forEach(function (s) { all.push([s.lat, s.lng]); });
    });
    if (!all.length) { map.setView([34, 108], 4); return; }
    if (all.length === 1) { map.setView(all[0], 9); return; }
    map.fitBounds(L.latLngBounds(all).pad(0.22), { maxZoom: 11 });
  }

  /* =========================================================
     7. 地点输入
     ========================================================= */
  function searchLocal(q) {
    const s = q.trim().toLowerCase();
    if (!s) return [];
    const exact = [], partial = [];
    for (let i = 0; i < CITIES.length; i++) {
      const c = CITIES[i];
      const n = c.name.toLowerCase();
      if (n === s) exact.push(c);
      else if (n.indexOf(s) !== -1) partial.push(c);
    }
    return exact.concat(partial).slice(0, 8);
  }

  let remoteTimer = null;
  function searchRemote(q, cb) {
    if (remoteTimer) clearTimeout(remoteTimer);
    remoteTimer = setTimeout(function () {
      const ctrl = new AbortController();
      const to = setTimeout(function () { ctrl.abort(); }, 4500);
      fetch(
        'https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=zh-CN&q=' +
        encodeURIComponent(q), { signal: ctrl.signal }
      )
        .then(function (r) { return r.json(); })
        .then(function (data) {
          clearTimeout(to);
          const out = (data || []).map(function (d) {
            const parts = (d.display_name || '').split(',');
            return {
              name: (parts[0] || d.name || '').trim(),
              lat: parseFloat(d.lat),
              lng: parseFloat(d.lon),
              sub: parts.slice(1, 4).join(',').trim()
            };
          }).filter(function (x) { return x.name && !isNaN(x.lat); });
          cb(out);
        })
        .catch(function () { clearTimeout(to); cb([]); });
    }, 380);
  }

  function createPlaceInput(placeholder) {
    const wrap = document.createElement('div');
    wrap.className = 'place-field';
    wrap._place = null;

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = placeholder;
    input.autocomplete = 'off';
    input.spellcheck = false;

    const list = document.createElement('div');
    list.className = 'suggest-list';

    wrap.appendChild(input);
    wrap.appendChild(list);

    let items = [], activeIdx = -1;

    function close() {
      list.classList.remove('open');
      list.innerHTML = '';
      items = []; activeIdx = -1;
    }

    function renderItems(arr) {
      items = arr; activeIdx = -1;
      if (!arr.length) {
        list.innerHTML = '<div class="suggest-empty">没有找到匹配地点，试试其他写法～</div>';
        list.classList.add('open');
        return;
      }
      list.innerHTML = arr.map(function (c, i) {
        return '<div class="suggest-item" data-i="' + i + '">' +
               '<span class="nm">' + esc(c.name) + '</span>' +
               (c.sub ? '<span class="sub">' + esc(c.sub) + '</span>' : '') +
               '</div>';
      }).join('');
      list.classList.add('open');
    }

    function pick(idx) {
      const c = items[idx];
      if (!c) return;
      wrap._place = { name: c.name, lat: c.lat, lng: c.lng };
      input.value = c.name;
      close();
    }

    list.addEventListener('mousedown', function (e) {
      const it = e.target.closest('.suggest-item');
      if (!it) return;
      e.preventDefault();
      pick(parseInt(it.dataset.i, 10));
    });

    input.addEventListener('input', function () {
      wrap._place = null;
      const q = input.value.trim();
      if (!q) { close(); return; }
      const local = searchLocal(q);
      renderItems(local);
      searchRemote(q, function (remote) {
        if (input.value.trim() !== q) return;
        const seen = {};
        local.forEach(function (c) { seen[c.name] = 1; });
        const merged = local.concat(remote.filter(function (r) { return !seen[r.name]; }));
        renderItems(merged.slice(0, 9));
      });
    });

    input.addEventListener('focus', function () {
      if (input.value.trim() && items.length) list.classList.add('open');
    });
    input.addEventListener('blur', function () { setTimeout(close, 160); });

    input.addEventListener('keydown', function (e) {
      if (!list.classList.contains('open')) return;
      const nodes = list.querySelectorAll('.suggest-item');
      if (!nodes.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, nodes.length - 1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); }
      else if (e.key === 'Enter') { e.preventDefault(); if (activeIdx >= 0) pick(activeIdx); return; }
      else if (e.key === 'Escape') { close(); return; }
      else return;
      nodes.forEach(function (n, i) { n.classList.toggle('active', i === activeIdx); });
      if (nodes[activeIdx]) nodes[activeIdx].scrollIntoView({ block: 'nearest' });
    });

    return wrap;
  }

  /* =========================================================
     8. 图片处理
     ========================================================= */
  function compressImage(file, maxW, quality) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function (e) {
        const img = new Image();
        img.onerror = reject;
        img.onload = function () {
          let w = img.naturalWidth || img.width;
          let h = img.naturalHeight || img.height;
          if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(canvas.toDataURL('image/jpeg', quality)); }
          catch (err) { reject(err); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function processFiles(files, targetArr, limit) {
    let added = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (!f.type || f.type.indexOf('image/') !== 0) continue;
      if (targetArr.length >= limit) {
        toast('最多添加 ' + limit + ' 张照片');
        break;
      }
      try {
        const data = await compressImage(f, PHOTO_MAX_W, PHOTO_QUALITY);
        targetArr.push({
          id: String(Date.now()) + '_' + Math.floor(Math.random() * 100000),
          data: data,
          name: f.name || 'photo.jpg'
        });
        added++;
      } catch (err) { /* skip */ }
    }
    return added;
  }

  /* =========================================================
     9. 时间选择器（带确认 / 取消）
     ========================================================= */
  const timeModal = document.getElementById('timeModal');
  const tpArriveDate = timeModal.querySelector('.tp-arrive-date');
  const tpArriveTime = timeModal.querySelector('.tp-arrive-time');
  const tpDepartDate = timeModal.querySelector('.tp-depart-date');
  const tpDepartTime = timeModal.querySelector('.tp-depart-time');
  let tpTargetRow = null;

  function openTimePicker(row) {
    tpTargetRow = row;
    const t = row._time || {};
    tpArriveDate.value = t.arriveDate || '';
    tpArriveTime.value = t.arriveTime || '';
    tpDepartDate.value = t.departDate || '';
    tpDepartTime.value = t.departTime || '';
    timeModal.classList.remove('hidden');
  }

  function closeTimePicker() {
    timeModal.classList.add('hidden');
    tpTargetRow = null;
  }

  document.getElementById('tpOk').addEventListener('click', function () {
    if (!tpTargetRow) { closeTimePicker(); return; }
    tpTargetRow._time = {
      arriveDate: tpArriveDate.value,
      arriveTime: tpArriveTime.value,
      departDate: tpDepartDate.value,
      departTime: tpDepartTime.value
    };
    updateTimeSummary(tpTargetRow);
    closeTimePicker();
  });

  document.getElementById('tpCancel').addEventListener('click', closeTimePicker);

  function updateTimeSummary(row) {
    const el = row.querySelector('.time-summary');
    if (!el) return;
    const t = row._time || {};
    const txt = stopTimeText({
      arriveDate: t.arriveDate, arriveTime: t.arriveTime,
      departDate: t.departDate, departTime: t.departTime
    });
    el.textContent = txt || '未设置时间';
    el.classList.toggle('empty', !txt);
  }

  /* =========================================================
     10. 新建旅程弹窗
     ========================================================= */
  const modal = document.getElementById('modal');
  const stopList = document.getElementById('stopList');
  const tripNameInput = document.getElementById('tripName');
  const swatchesEl = document.getElementById('swatches');

  let selectedColor = PALETTE[0];

  function buildSwatches() {
    swatchesEl.innerHTML = PALETTE.map(function (c) {
      return '<button type="button" class="swatch" data-color="' + c +
             '" style="background:' + c + '"></button>';
    }).join('') +
    '<label class="swatch custom" title="自定义颜色">' +
      '<input type="color" value="' + selectedColor + '">' +
    '</label>';

    swatchesEl.querySelectorAll('.swatch[data-color]').forEach(function (b) {
      b.addEventListener('click', function () {
        selectedColor = b.dataset.color;
        updateSwatches();
      });
    });

    const cc = swatchesEl.querySelector('.swatch.custom input');
    if (cc) {
      cc.addEventListener('input', function () {
        selectedColor = cc.value;
        updateSwatches();
      });
    }
    updateSwatches();
  }

  function updateSwatches() {
    swatchesEl.querySelectorAll('.swatch[data-color]').forEach(function (b) {
      b.classList.toggle('active',
        b.dataset.color.toLowerCase() === selectedColor.toLowerCase());
    });
    const custom = swatchesEl.querySelector('.swatch.custom');
    if (custom) {
      const cc = custom.querySelector('input');
      const isCustom = PALETTE.map(function (c) { return c.toLowerCase(); })
        .indexOf(selectedColor.toLowerCase()) === -1;
      custom.classList.toggle('active', isCustom);
      if (cc && isCustom && cc.value.toLowerCase() !== selectedColor.toLowerCase()) {
        cc.value = selectedColor;
      }
    }
  }

  function createStopRow(index) {
    const row = document.createElement('div');
    row.className = 'stop-row';
    row.dataset.index = index;
    row._photos = [];
    row._time = { arriveDate: '', arriveTime: '', departDate: '', departTime: '' };

    /* 顶部 */
    const top = document.createElement('div');
    top.className = 'row-top';
    const tag = document.createElement('span');
    tag.className = 'tag' + (index === 0 ? ' start' : '');
    tag.textContent = index === 0 ? '起点' : ('第 ' + index + ' 站');
    top.appendChild(tag);

    const spacer = document.createElement('div');
    spacer.className = 'spacer';
    top.appendChild(spacer);

    if (index > 0) {
      const del = document.createElement('button');
      del.className = 'del-btn';
      del.type = 'button';
      del.title = '删除这一站';
      del.textContent = '✕';
      del.addEventListener('click', function () {
        if (document.querySelectorAll('#stopList .stop-row').length <= 2) {
          toast('至少需要保留起点和终点两个地点');
          return;
        }
        row.remove();
        renumber();
      });
      top.appendChild(del);
    }
    row.appendChild(top);

    /* 交通方式 */
    let modeSel = null;
    if (index > 0) {
      modeSel = document.createElement('select');
      modeSel.className = 'mode-select';
      modeSel.innerHTML = MODES.map(function (m) {
        return '<option value="' + m.id + '">' + m.icon + ' ' + m.name + '</option>';
      }).join('');
      modeSel.value = 'train';
      row.appendChild(modeSel);
    }

    /* 地点 */
    const field = createPlaceInput(index === 0
      ? '输入起点城市，如：北京'
      : '输入到达城市，如：上海');
    row.appendChild(field);

    /* 时间（按钮 + 摘要，点击后弹出带确认/取消的面板） */
    const timeBlock = document.createElement('div');
    timeBlock.className = 'time-block';

    const tbtn = document.createElement('button');
    tbtn.type = 'button';
    tbtn.className = 'time-open-btn';
    tbtn.textContent = '⏱ 设置时间';
    tbtn.addEventListener('click', function () { openTimePicker(row); });

    const tsum = document.createElement('span');
    tsum.className = 'time-summary empty';
    tsum.textContent = '未设置时间';

    timeBlock.appendChild(tbtn);
    timeBlock.appendChild(tsum);
    row.appendChild(timeBlock);

    /* 文字描述 */
    const noteInput = document.createElement('textarea');
    noteInput.className = 'stop-note';
    noteInput.rows = 2;
    noteInput.placeholder = '写下在这个城市的回忆、见闻…（可选）';
    row.appendChild(noteInput);

    /* 站点照片 */
    const photoBar = document.createElement('div');
    photoBar.className = 'stop-photo-bar';

    const pbtn = document.createElement('button');
    pbtn.type = 'button';
    pbtn.className = 'stop-photo-btn';
    pbtn.textContent = '📷 城市照片';

    const pprev = document.createElement('div');
    pprev.className = 'stop-photos';

    function renderStopPhotos() {
      pprev.innerHTML = '';
      row._photos.forEach(function (p) {
        const item = document.createElement('div');
        item.className = 'sp-item';
        const img = document.createElement('img');
        img.src = p.data;
        img.alt = p.name || '';
        item.appendChild(img);
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'sp-del';
        del.textContent = '×';
        del.addEventListener('click', function (e) {
          e.stopPropagation();
          row._photos = row._photos.filter(function (x) { return x.id !== p.id; });
          renderStopPhotos();
        });
        item.appendChild(del);
        pprev.appendChild(item);
      });
    }

    pbtn.addEventListener('click', function () {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.multiple = true;
      inp.addEventListener('change', async function () {
        const files = Array.from(inp.files || []);
        if (!files.length) return;
        toast('正在处理照片…');
        const n = await processFiles(files, row._photos, PHOTO_LIMIT_PER_STOP);
        renderStopPhotos();
        if (n) toast('已添加 ' + n + ' 张城市照片');
      });
      inp.click();
    });

    photoBar.appendChild(pbtn);
    photoBar.appendChild(pprev);
    row.appendChild(photoBar);

    return row;
  }

  function renumber() {
    const rows = document.querySelectorAll('#stopList .stop-row');
    Array.prototype.forEach.call(rows, function (row, i) {
      row.dataset.index = i;
      const tag = row.querySelector('.tag');
      if (tag) {
        tag.textContent = i === 0 ? '起点' : ('第 ' + i + ' 站');
        tag.className = 'tag' + (i === 0 ? ' start' : '');
      }
    });
  }

  function openModal() {
    stopList.innerHTML = '';
    tripNameInput.value = '';
    selectedColor = PALETTE[journeys.length % PALETTE.length];
    buildSwatches();
    stopList.appendChild(createStopRow(0));
    stopList.appendChild(createStopRow(1));
    modal.classList.remove('hidden');
    setTimeout(function () { tripNameInput.focus(); }, 60);
  }

  function closeModal() { modal.classList.add('hidden'); }

  document.getElementById('btnNew').addEventListener('click', openModal);
  document.getElementById('btnCancel').addEventListener('click', closeModal);

  document.getElementById('btnAddStop').addEventListener('click', function () {
    const rows = document.querySelectorAll('#stopList .stop-row');
    const newRow = createStopRow(rows.length);
    stopList.appendChild(newRow);
    renumber();
    const inp = newRow.querySelector('.place-field input');
    if (inp) inp.focus();
    newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  /* 注意：点击遮罩不再关闭新建旅程弹窗，避免误触丢失填写内容 */

  document.getElementById('btnSave').addEventListener('click', function () {
    const rows = document.querySelectorAll('#stopList .stop-row');
    const stops = [];

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const field = row.querySelector('.place-field');
      const input = field.querySelector('input');
      let place = field._place;

      if (!place) {
        const txt = input.value.trim();
        const m = CITIES.filter(function (c) { return c.name === txt; })[0];
        if (m) place = { name: m.name, lat: m.lat, lng: m.lng };
      }
      if (!place) {
        toast('第 ' + (i + 1) + ' 个地点还没选好，请从下拉提示中选择城市');
        input.focus();
        return;
      }

      const modeSel = row.querySelector('.mode-select');
      const noteEl = row.querySelector('.stop-note');
      const tm = row._time || {};

      stops.push({
        name: place.name,
        lat: place.lat,
        lng: place.lng,
        mode: i === 0 ? null : (modeSel ? modeSel.value : 'other'),
        arriveDate: tm.arriveDate || '',
        arriveTime: tm.arriveTime || '',
        departDate: tm.departDate || '',
        departTime: tm.departTime || '',
        note: noteEl ? noteEl.value.trim() : '',
        photos: row._photos.slice()
      });
    }

    if (stops.length < 2) {
      toast('至少需要起点和终点两个地点');
      return;
    }

    const name = tripNameInput.value.trim() ||
      (stops[0].name + ' → ' + stops[stops.length - 1].name);

    const newJourney = {
      id: Date.now() + Math.floor(Math.random() * 1000),
      name: name,
      color: selectedColor,
      stops: stops,
      photos: [],
      visible: true,
      createdAt: Date.now()
    };

    journeys.push(newJourney);
    const ok = persist();
    renderSidebar();
    renderAll();
    closeModal();

    setTimeout(function () { fitJourney(newJourney); }, 80);
    toast(ok ? '旅程已保存 🎉' : '旅程已保存，但本地存储空间不足');
  });

  /* =========================================================
     11. 图片查看器
     ========================================================= */
  const viewer = document.getElementById('viewer');
  const viewerImg = document.getElementById('viewerImg');
  const viewerCount = document.getElementById('viewerCount');
  const viewerTitle = document.getElementById('viewerTitle');
  let viewerPhotos = [], viewerIdx = 0;

  function updateViewer() {
    if (!viewerPhotos.length) { closeViewer(); return; }
    viewerIdx = (viewerIdx + viewerPhotos.length) % viewerPhotos.length;
    viewerImg.src = viewerPhotos[viewerIdx].data;
    viewerCount.textContent = (viewerIdx + 1) + ' / ' + viewerPhotos.length;
  }

  function openViewer(photos, index, title) {
    if (!photos || !photos.length) return;
    viewerPhotos = photos.slice();
    viewerIdx = index >= 0 ? index : 0;
    viewerTitle.textContent = title || '';
    updateViewer();
    viewer.classList.remove('hidden');
  }

  function closeViewer() {
    viewer.classList.add('hidden');
    viewerImg.src = '';
    viewerPhotos = []; viewerIdx = 0;
    viewerTitle.textContent = '';
  }

  document.getElementById('viewerClose').addEventListener('click', closeViewer);
  document.getElementById('viewerPrev').addEventListener('click', function () {
    viewerIdx--; updateViewer();
  });
  document.getElementById('viewerNext').addEventListener('click', function () {
    viewerIdx++; updateViewer();
  });
  viewer.addEventListener('click', function (e) {
    if (e.target === viewer) closeViewer();
  });

  /* =========================================================
     12. 键盘
     ========================================================= */
  document.addEventListener('keydown', function (e) {
    if (!viewer.classList.contains('hidden')) {
      if (e.key === 'Escape') closeViewer();
      else if (e.key === 'ArrowLeft') { viewerIdx--; updateViewer(); }
      else if (e.key === 'ArrowRight') { viewerIdx++; updateViewer(); }
      return;
    }
    if (e.key === 'Escape') {
      if (!timeModal.classList.contains('hidden')) { closeTimePicker(); return; }
      if (!cityModal.classList.contains('hidden')) { closeCityDetail(); return; }
      if (!modal.classList.contains('hidden')) closeModal();
    }
  });

  /* =========================================================
     13. Toast
     ========================================================= */
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }

  /* =========================================================
     14. 事件 & 启动
     ========================================================= */
  document.getElementById('btnFit').addEventListener('click', fitAll);

  document.getElementById('btnShowAll').addEventListener('click', function () {
    journeys.forEach(function (j) { j.visible = true; });
    persist(); renderSidebar(); renderAll();
  });

  document.getElementById('btnHideAll').addEventListener('click', function () {
    journeys.forEach(function (j) { j.visible = false; });
    persist(); renderSidebar(); renderAll();
  });

  /* 统一的「显示城市时间」开关 */
  const btnToggleTime = document.getElementById('btnToggleTime');
  function updateTimeToggleBtn() {
    btnToggleTime.classList.toggle('active', showCityTime);
    btnToggleTime.textContent = showCityTime ? '⏱ 显示时间' : '⏱ 隐藏时间';
  }
  btnToggleTime.addEventListener('click', function () {
    showCityTime = !showCityTime;
    try { localStorage.setItem(TIME_VIS_KEY, showCityTime ? '1' : '0'); } catch (e) {}
    updateTimeToggleBtn();
    renderAll();
    toast(showCityTime ? '地图已显示城市时间' : '地图已隐藏城市时间');
  });

  map.on('zoomend', function () {
    clearTimeout(map._arrowTimer);
    map._arrowTimer = setTimeout(rebuildArrows, 90);
  });

  window.addEventListener('resize', function () {
    setTimeout(function () { map.invalidateSize(); }, 180);
  });

  restore();
  updateTimeToggleBtn();
  renderSidebar();
  renderAll();
  if (journeys.length) setTimeout(fitAll, 200);
})();
</script>
</body>
